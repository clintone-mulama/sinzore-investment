steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sinzore-investment-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sinzore-investment-backend:latest'
      - './backend'

  # 2. Push Container Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sinzore-investment-backend:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sinzore-investment-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sinzore-investment-backend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/sinzore-investment-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sinzore-investment-backend:latest'
